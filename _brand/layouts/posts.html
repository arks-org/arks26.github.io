---
layout: default
---

{%- include content/content_assigns.html -%}

<div class="arka arka__content arka__content--body container my-4">
  <div class="row arka__content arka__content--body container">
	<div class="col">
		{{ content_only | markdownify }}		
	</div>
  </div>

{% for post in site.posts %}
	<div class="row py-2 my-2">
		<div class="col-2">
		  {% if post.image %}
			<img src="{{ site.baseurl }}{{ post.image.url }}" alt="Feature image for blog post: {{ post.title }}" class="img-thumbnail img-fluid">
		  {% else %}
            <img src="{{ site.baseurl }}/assets/images/posts/arka_blog_default.png" alt="Default feature image for blog post: {{ post.title }}" class="img-thumbnail img-fluid">
		  {% endif %}
		</div>
		<div class="col-10">
			<h2 class="h3">
				<a href="{{ site.baseurl }}{{ post.url }}"
				   class="">
					{{ post.title }}
				</a>
			</h2>
			<small class="arka__tagline d-block text-secondary text-uppercase fs-6">
				{{ post.date | date: "%Y-%m-%d" }}
			</small>
			<small class="arka__tagline d-block text-secondary text-uppercase fs-6">
			    {%- include content/authors.html post=post -%}
			</small>
		</div>
	</div>
{% endfor %}

  <!-- Pagination links -->
  <ul class="pagination">
  </ul>
</div>
