<!--
  Start, change, or end a section. Arguments:
  - do: "start", "end", or "changeto"
  - color: "main" (default) or "alt"
  - label: section aria-label

  Usage:
    include content/section.html do="start" color="main" label="Intro"
    include content/section.html do="changeto" color="alt" label="Next"
    include content/section.html do="end"

  Surrounding blank lines and no indentation to protect markdown content.
-->

{% if include.do == "end" or include.do == "changeto" %}
</div>
</section>
{% endif %}
{% if include.do == "start" or include.do == "changeto" %}
<section class="arka__section arka__section--{{ include.color | default: 'main' }}" aria-label="{{ include.label | default: '' }}">
<div class="arka__content arka__content--body container" markdown="1">
{% endif %}
